;=============================================================================
; iec101_slave.ini — IEC 60870-5-101 从站配置
;
; 串口 RS-485 / TCP 串口服务器
; 响应总召唤 GI、遥控、时钟同步
;=============================================================================

[global]
port_name=COM1
baud=9600
parity=even
data_bits=8
stop_bits=1
verbose=1

[Device_1]
link_addr=1
common_addr=1
desc=1号从站

di_001 = ioa=1000, ch=1, dev=1, point=2
di_002 = ioa=1001, ch=1, dev=1, point=3

ai_001 = ioa=2000, ch=1, dev=1, point=1, type=M_ME_NC_1
