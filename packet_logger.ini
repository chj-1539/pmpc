;=============================================================================
; packet_logger.ini — Modbus 报文记录器配置
; 生产环境建议 enable=0
;=============================================================================

[global]
; 日志文件输出目录
log_dir=logs/traffic

; 是否解析报文内容（1=解析，0=仅 HEX）
parse=1

; 日志文件保留天数（超出自动清理，TODO）
max_days=30
