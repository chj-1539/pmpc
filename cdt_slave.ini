;=============================================================================
; cdt_slave.ini — CDT 从站（RTU，主动发送）配置
;
; 主动循环上送 CDT 规约帧
; AI → YC(addr)  DI → YX(addr,bit)
;=============================================================================

[global]
port_name=COM1
baud=1200
parity=even
data_bits=8
stop_bits=1
cycle_ms=1000
verbose=1

[Device_1]
station=1

; ─── YC 遥测：addr=序号, ch=本地通道, dev=本地设备, point=本地AI点号, scale=系数, offset=偏移量
yc_001 = addr=0, ch=1, dev=1, point=1, scale=0.1
yc_002 = addr=1, ch=1, dev=1, point=2, scale=0.1

; ─── YX 遥信：addr=字节序号, bit=位号, ch=本地通道, dev=本地设备, point=本地DI点号
yx_001 = addr=0, bit=0, ch=1, dev=1, point=2
yx_002 = addr=0, bit=1, ch=1, dev=1, point=3

; ─── YM 电度（帧0x60）：addr=序号, ch=本地通道, dev=本地设备, point=本地AI点号, scale=系数, offset=偏移量
ym_001 = addr=0, ch=1, dev=1, point=1, scale=0.01
