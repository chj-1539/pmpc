[global]
watch_interval=2

[modbus_tcp_master]
; Modbus TCP 主站采集
enable=1
cfg_file=modbus_tcp_master.ini
auto_reload=1

[modbus_tcp_slave]
; Modbus TCP 从站（FC01~05，点对点映射，地址可不连续）
enable=0
cfg_file=modbus_tcp_slave.ini
auto_reload=1

[modbus_rtu_master]
; Modbus RTU 主站采集（串口）
enable=0
cfg_file=modbus_rtu_master.ini
auto_reload=0

[iec104_master]
; IEC 60870-5-104 主站采集（长连接+总召唤+主动上报）
enable=0
cfg_file=iec104_master.ini
auto_reload=0

[iec104_slave]
; IEC 60870-5-104 从站（GI响应+遥控+DI变化上送+AI循环上送）
enable=0
cfg_file=iec104_slave.ini
auto_reload=0

[dlt645_master]
; DLT 645 电表采集（RS-485 串口，支持1997/2007）
enable=0
cfg_file=dlt645_master.ini
auto_reload=0

[cdt_master]
; CDT 主站（被动接收 RTU 循环上送）
enable=0
cfg_file=cdt_master.ini
auto_reload=0

[cdt_slave]
; CDT 从站（RTU，主动循环上送）
enable=0
cfg_file=cdt_slave.ini
auto_reload=0

[modbus_rtu_slave]
; Modbus RTU 从站（FC01/02/03/04/05，串口）
enable=0
cfg_file=modbus_rtu_slave.ini
auto_reload=0

[iec103_master]
; IEC 60870-5-103 主站（FUN+INF，串口/TCP）
enable=0
cfg_file=iec103_master.ini
auto_reload=0

[iec101_master]
; IEC 60870-5-101 主站（串口，ASDU同104）
enable=0
cfg_file=iec101_master.ini
auto_reload=0

[iec101_slave]
; IEC 60870-5-101 从站（串口，GI响应+遥控）
enable=0
cfg_file=iec101_slave.ini
auto_reload=0

[packet_logger]
; 报文记录器，记录 Modbus 收发报文到文件
enable=1
cfg_file=packet_logger.ini
auto_reload=1

[debug_console]
; 调试控制台（TCP 9090），仅开发调试用，生产环境关闭
enable=1
cfg_file=debug_console.ini
auto_reload=0

[data_recorder]
; 数据存储模块（MySQL），可配置点位及存盘间隔
enable=1
cfg_file=data_recorder.ini
auto_reload=1

[pemp_server]
; PEMP2.0 TCP 遥测推送服务
enable=1
cfg_file=pemp_server.ini
auto_reload=1

[redundancy]
; 双机冗余（心跳+数据同步+角色切换）
enable=0
cfg_file=redundancy.ini
auto_reload=1
