;=============================================================================
; modbus_tcp_slave.ini — Modbus TCP 从站配置
; 支持功能码: 01 读线圈 / 02 读离散输入 / 03 读保持寄存器
;             04 读输入寄存器 / 05 写单个线圈
; 点对点映射：每个条目一一对应一个 Modbus 地址 → 一个本地点
; Modbus 地址可以不连续，可跨通道、设备
; DI 点号约定：点号 1 为通讯状态，业务遥信从 point=2 开始
;=============================================================================

[global]
port=503                  ; TCP 监听端口（避免和 Modbus Master 502 冲突）
max_clients=10            ; 最大并发客户端数
verbose=1

; ─── 第1个从站设备 ──────────────────────────────────────────────────────────
[Device_1]
station_id=1
desc=1号从站

; ── FC01: 读线圈 → 本地遥信 DI ──
;   addr  = Modbus 线圈地址
;   ch    = 本地通道号
;   dev   = 本地设备号
;   point = 本地遥信点号（从 2 开始，点号 1 为通讯状态）
fc01_001 = addr=0,  ch=1, dev=1, point=1
fc01_002 = addr=1,  ch=1, dev=1, point=2     ; 地址可以不连续
fc01_003 = addr=2,  ch=1, dev=1, point=3
fc01_004 = addr=3, ch=1, dev=1, point=4     ; 跨设备
fc01_005 = addr=4, ch=1, dev=1, point=5     ; 跨通道

; ── FC02: 读离散输入 → 本地遥信 DI ──
;   格式同 FC01，独立地址空间
fc02_001 = addr=0,  ch=1, dev=1, point=2
fc02_002 = addr=1,  ch=1, dev=1, point=3
fc02_003 = addr=8,  ch=2, dev=1, point=2

; ── FC03: 读保持寄存器 → 本地遥测 AI ──
;   addr   = Modbus 寄存器地址
;   ch     = 本地通道号
;   dev    = 本地设备号
;   point  = 本地遥测点号
;   dtype  = 数据类型 (uint16/int16/uint32/int32/float/double)
;   endian = 字节序 (AB/BA/CDAB/DCBA/..., 默认 AB)
;   scale  = 系数 (默认 1.0)
;   offset = 偏移量 (默认 0.0)
fc03_001 = addr=0,  ch=1, dev=1, point=1, dtype=uint16
fc03_002 = addr=2,  ch=1, dev=1, point=2, dtype=float,  scale=0.01
fc03_003 = addr=5,  ch=1, dev=1, point=3, dtype=int32,  endian=CDAB
fc03_004 = addr=10, ch=2, dev=1, point=4, dtype=uint16, scale=0.1, offset=-50

; ── FC03 按位读遥信 ──
;   addr   = Modbus 寄存器地址
;   bit    = 位号 0~15
;   ch     = 本地通道号
;   dev    = 本地设备号
;   point  = 本地遥信点号
fc03_101 = addr=100, bit=0, ch=1, dev=1, point=2
fc03_102 = addr=100, bit=1, ch=1, dev=1, point=3     ; 同一寄存器不同位
fc03_103 = addr=100, bit=7, ch=1, dev=1, point=4
fc03_104 = addr=101, bit=0, ch=1, dev=2, point=2     ; 跨设备

; ── FC04: 读输入寄存器 → 本地遥测 AI ──
;   格式同 FC03 AI
fc04_001 = addr=0,  ch=1, dev=1, point=1, dtype=uint16
fc04_002 = addr=3,  ch=2, dev=1, point=2, dtype=float, scale=0.01

; ── FC04 按位读遥信 ──
fc04_101 = addr=50, bit=0, ch=1, dev=1, point=2
fc04_102 = addr=50, bit=1, ch=1, dev=1, point=3

; ── FC05: 写单个线圈 → 本地遥控 DO ──
;   addr   = Modbus 线圈地址
;   ch     = 本地通道号
;   dev    = 本地设备号
;   point  = 本地遥控点号
;   invert = 是否反相 (0/1, 默认 0)
fc05_001 = addr=0,  ch=1, dev=1, point=1
fc05_002 = addr=1,  ch=1, dev=1, point=2, invert=1
fc05_003 = addr=3,  ch=1, dev=2, point=1

; ─── 第2个从站设备 ──────────────────────────────────────────────────────────
[Device_2]
station_id=2
desc=2号从站

fc01_001 = addr=0, ch=1, dev=1, point=2
fc03_001 = addr=0, ch=1, dev=1, point=1, dtype=uint16
fc03_002 = addr=1, ch=1, dev=1, point=2, dtype=float, scale=0.1
fc05_001 = addr=0, ch=1, dev=1, point=1
