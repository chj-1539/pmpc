;=============================================================================
; cdt_master.ini — CDT 主站（被动接收）配置
;
; 接收 RTU 循环上送的 CDT 规约帧
; YC(addr) → AI  YX(addr,bit) → DI
;=============================================================================

[global]
timeout_ms=1000
verbose=1
frame_timeout_ms=5000

[Channel_1]
port_name=COM1
baud=1200
parity=even
data_bits=8
stop_bits=1

[Device_1]
channel=1
station=1

; ─── YC 遥测：addr=序号, point=本地AI点号, scale=系数, offset=偏移量
yc_001 = addr=0, point=1, scale=0.1
yc_002 = addr=1, point=2, scale=0.1

; ─── YX 遥信：addr=字节序号, bit=位号, point=本地DI点号
yx_001 = addr=0, bit=0, point=2
yx_002 = addr=0, bit=1, point=3

; ─── YM 电度（帧0x60~0x63）：addr=序号, point=本地AI点号, scale=系数, offset=偏移量
ym_001 = addr=0, point=1, scale=0.01
