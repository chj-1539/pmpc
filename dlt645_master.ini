;=============================================================================
; dlt645_cfg.ini — DLT 645 电表采集配置
;
; 层次：global → Channel → Template → Device
; 每通道独立线程，RS-485 串口
; 1997/2007 版通过模板区分，设备引用模板
; 所有数据（含电能量）统一用 AI 存储
;=============================================================================

[global]
timeout_ms=1000
retry_count=2
retry_sleep_ms=5000
verbose=1
baud=2400

[Channel_1]
port_name=COM1
baud=2400
parity=even
data_bits=8
stop_bits=1
scan_ms=5000

; ─── 1997 版模板：数据标识 2 字节 ──────────────────────────────────────────
[Template_1997]
; data_id=数据标识(HEX), point=本地AI点号, scale=系数, offset=偏移量
; 工程值 = BCD原始值 * scale + offset
ai_001 = data_id=0000, point=1, scale=0.01     ; 正向有功电能
ai_002 = data_id=0101, point=3, scale=0.1      ; A相电压
ai_003 = data_id=0102, point=4, scale=0.1      ; B相电压
ai_004 = data_id=0103, point=5, scale=0.1      ; C相电压
ai_005 = data_id=0201, point=6, scale=0.001    ; A相电流
ai_006 = data_id=0202, point=7, scale=0.001    ; B相电流
ai_007 = data_id=0203, point=8, scale=0.001    ; C相电流
ai_008 = data_id=0300, point=9, scale=1.0      ; 有功功率
ai_009 = data_id=0500, point=10, scale=0.001   ; 功率因数
ai_010 = data_id=0600, point=11, scale=0.01    ; 频率

; ─── 2007 版模板：数据标识 4 字节 ──────────────────────────────────────────
[Template_2007]
ai_001 = data_id=00000000, point=1, scale=0.01   ; 正向有功电能
ai_002 = data_id=00000100, point=2, scale=0.01   ; 反向有功电能
ai_003 = data_id=00010100, point=3, scale=0.1    ; A相电压
ai_004 = data_id=00010200, point=4, scale=0.1    ; B相电压
ai_005 = data_id=00010300, point=5, scale=0.1    ; C相电压
ai_006 = data_id=00020100, point=6, scale=0.001  ; A相电流
ai_007 = data_id=00020200, point=7, scale=0.001  ; B相电流
ai_008 = data_id=00020300, point=8, scale=0.001  ; C相电流
ai_009 = data_id=00030000, point=9, scale=1.0    ; 有功功率
ai_010 = data_id=00050000, point=10, scale=0.001 ; 功率因数
ai_011 = data_id=00060000, point=11, scale=0.01  ; 频率

[Device_1]
channel=1
address=010001234567           ; 电表地址（12位BCD码）
template=2007
desc=1号电表
baud=2400                      ; 本设备波特率，与通道不同时自动切换

[Device_2]
channel=1
address=010001234568
template=1997
desc=2号电表(1997版)
baud=1200                      ; 1997版典型1200bps
