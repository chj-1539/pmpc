;=============================================================================
; iec104_slave.ini — IEC 60870-5-104 从站配置
;
; 服务端角色，等待主站连接
; 支持多公共地址（common_addr）
; 点对点映射：IOA → 本地 (ch, dev, pt)
;=============================================================================

[global]
; ─── TCP 监听 ───
port=2404
max_clients=10
verbose=1

; ─── IEC 104 连接参数 ───
t0=30  t1=15  t2=10  t3=20  k=12  w=8

; ─── 主动上送 ───
; DI 默认变化上送（EventBus 驱动），always_on
; 时标: 0=不带时标(M_SP_NA_1), 1=带时标(M_SP_TB_1)
spontaneous_with_timestamp=1

; ─── AI 上送模式 ───
; change  — 变化上送（值变化时触发）
; cycle   — 循环上送（按 ai_cycle_s 间隔定时上送）
; both    — 变化 + 循环上送
ai_upload_mode=change
ai_cycle_s=60

; ─── 访问控制（可选） ───
; [listen_1]  ip=192.168.1.100  port=2404

; ─── 时钟同步 ───
clock_sync_enable=1
adjust_local_clock=0

; ─── 第1个从站设备 ──────────────────────────────────────────────────────────
[Device_1]
common_addr=1
desc=1号从站

; ── DI: 点对点映射 ──
; ioa=IOA, ch=本地通道, dev=本地设备, point=本地点号
di_001 = ioa=1000, ch=1, dev=1, point=2
di_002 = ioa=1001, ch=1, dev=1, point=3
di_003 = ioa=1002, ch=1, dev=1, point=4

; ── AI: 遥测映射 ──
; type: M_ME_NC_1(浮点) / M_ME_NA_1(归一化) / M_ME_NB_1(标度化)
; 工程值 = 原始值 * scale + offset（GI响应时反算：raw = (eng - offset) / scale）
ai_001 = ioa=2000, type=M_ME_NC_1, ch=1, dev=1, point=1
ai_002 = ioa=2001, type=M_ME_NC_1, ch=1, dev=1, point=2, scale=0.01
ai_003 = ioa=2002, type=M_ME_NA_1, ch=1, dev=1, point=3, scale=0.1, offset=-50

; ── 电度: 电能累积值 ───
; 支持 scale + offset：工程值 = 原始脉冲 * scale + offset
energy_001 = ioa=5000, ch=1, dev=1, point=1, scale=0.001, offset=0

; ── DO: 遥控映射 ──
; 同一 IOA 通过 val= 区分多个操作值
do_001 = ioa=3000, val=0, ch=1, dev=1, point=1   ; 分闸
do_002 = ioa=3000, val=1, ch=1, dev=1, point=2   ; 合闸

; ── AO: 遥调映射 ──
ao_001 = ioa=4000, ch=1, dev=1, point=1, scale=1.0, offset=0

; ─── 第2个从站设备 ──────────────────────────────────────────────────────────
[Device_2]
common_addr=2
desc=2号从站

di_001 = ioa=1000, ch=1, dev=1, point=2
ai_001 = ioa=2000, type=M_ME_NC_1, ch=1, dev=1, point=1
do_001 = ioa=3000, val=0, ch=1, dev=1, point=1
do_002 = ioa=3000, val=1, ch=1, dev=1, point=2
