;=============================================================================
; iec104_cfg.ini — IEC 60870-5-104 主站采集配置
;
; 层次：global → Channel → Template → Device
; 每通道独立线程，长连接 + 总召唤 + 主动上报
;=============================================================================

[global]
; ─── 通讯参数 ───
timeout_ms=5000
retry_count=3
retry_sleep_ms=10000
verbose=1

; ─── 总召唤周期（秒），0=不自动总召唤 ───
gi_cycle_s=300

; ─── 时钟同步 ───
clock_sync_enable=1
clock_sync_interval_s=3600

; ─── 遥信变化主动上报 ───
spontaneous_enable=1

[Channel_1]
ip=127.0.0.1
port=2404
timeout_ms=5000
gi_cycle_s=300
clock_sync_enable=1
clock_sync_interval_s=3600
spontaneous_enable=1
; IEC 104 连接参数（可省略使用默认值）
t0=30  t1=15  t2=10  t3=20  k=12  w=8

[Template_保护装置]
; ─── 遥信（M_SP_NA_1 = 单点遥信, M_SP_TB_1 = 带时标）───
; ioa=信息对象地址, type=ASDU类型, ch=本地通道, dev=本地设备, point=本地点号
di_001 = ioa=1000, type=M_SP_NA_1, ch=1, dev=1, point=2
di_002 = ioa=1001, type=M_SP_NA_1, ch=1, dev=1, point=3
di_003 = ioa=1002, type=M_SP_NA_1, ch=1, dev=1, point=4

; ─── 遥测 ───
; 所有 type 都支持 scale + offset：工程值 = raw * scale + offset
; type: M_ME_NC_1(浮点) M_ME_NA_1(归一化) M_ME_NB_1(标度化) M_ME_TD_1(带时标)
ai_001 = ioa=2000, type=M_ME_NC_1, ch=1, dev=1, point=1, scale=0.01
ai_002 = ioa=2001, type=M_ME_NC_1, ch=1, dev=1, point=2, scale=1.0, offset=0
ai_003 = ioa=2002, type=M_ME_NA_1, ch=1, dev=1, point=3, scale=100.0, offset=0

; ─── 电度（M_IT_NA_1 = 电能脉冲计数）───
energy_001 = ioa=5000, type=M_IT_NA_1, ch=1, dev=1, point=1, scale=0.001

; ─── 遥控 ───
; 同一 IOA 通过 val= 区分多个命令，映射不同 DO 点
do_001 = ioa=3000, val=0, type=C_SC_NA_1, ch=1, dev=1, point=1   ; 分闸
do_002 = ioa=3000, val=1, type=C_SC_NA_1, ch=1, dev=1, point=2   ; 合闸
do_003 = ioa=3001, val=0, type=C_SC_NA_1, ch=1, dev=1, point=3   ; 分
do_004 = ioa=3001, val=1, type=C_SC_NA_1, ch=1, dev=1, point=4   ; 合

; ─── 遥调（C_SE_NC_1 = 浮点设定值）───
ao_001 = ioa=4000, type=C_SE_NC_1, ch=1, dev=1, point=1

[Device_1]
channel=1
common_addr=1
template=保护装置
desc=1号保护设备

[Device_2]
channel=1
common_addr=2
template=保护装置
desc=2号保护设备
