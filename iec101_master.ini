;=============================================================================
; iec101_master.ini — IEC 60870-5-101 主站采集配置
;
; 串口 RS-485 / TCP 串口服务器
; ASDU 层与 IEC 104 一致，链路层为可变帧/固定帧
;=============================================================================

[global]
timeout_ms=1000
verbose=1

[Channel_1]
port_name=COM1
baud=9600
parity=even
data_bits=8
stop_bits=1
timeout_ms=1000
gi_cycle_s=300

[Device_1]
channel=1
link_addr=1            ; 链路地址
common_addr=1          ; 公共地址
desc=1号设备

; 遥信
di_001 = ioa=1000, point=2
di_002 = ioa=1001, point=3

; 遥测
ai_001 = ioa=2000, point=1, type=M_ME_NC_1, scale=0.01
ai_002 = ioa=2001, point=2, type=M_ME_NA_1, scale=0.1, offset=-50

; 电度（按 AI 处理）
energy_001 = ioa=5000, point=1, scale=0.001
