;=============================================================================
; modbus_rtu_slave.ini — Modbus RTU 从站配置
;
; 点对点映射：每个条目一一对应一个 Modbus 地址 → 一个本地点
; Modbus 地址可以不连续，可跨通道、设备
; 支持物理串口和 TCP 串口服务器
;=============================================================================

[global]
port_name=COM1
baud=9600
parity=even
data_bits=8
stop_bits=1
verbose=1

[Device_1]
station_id=1
desc=1号从站

; ── FC01: 读线圈 → 本地 DI（业务遥信从 point=2 开始）──
fc01_001 = addr=0,  ch=1, dev=1, point=2
fc01_002 = addr=1,  ch=1, dev=1, point=3

; ── FC02: 读离散输入 → 本地 DI ──
fc02_001 = addr=0,  ch=1, dev=1, point=2

; ── FC03: 读保持寄存器 → 本地 AI ──
fc03_001 = addr=0,  ch=1, dev=1, point=1, dtype=uint16

; ── FC05: 写单个线圈 → 本地 DO ──
fc05_001 = addr=0,  ch=1, dev=1, point=1
