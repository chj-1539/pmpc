;=============================================================================
; iec103_master.ini — IEC 60870-5-103 主站采集配置
;
; 层次：global → Channel → Template → Device
; 每通道独立线程，RS-485 串口 / TCP 串口服务器
; 数据通过 FUN(功能码) + INF(信息号) 标识
; 所有数据点按 ai 顺序编号（含遥脉）
;=============================================================================

[global]
timeout_ms=1000
retry_count=2
retry_sleep_ms=5000
verbose=1

[Channel_1]
port_name=COM1
baud=9600
parity=even
data_bits=8
stop_bits=1
scan_ms=3000

; ─── 模板定义 ──────────────────────────────────────────────────────────────
[Template_保护装置]

; 遥信 DI: fun=功能码, inf=信息号, point=本地DI点号
di_001 = fun=0x01, inf=0x01, point=2
di_002 = fun=0x01, inf=0x02, point=3
di_003 = fun=0x01, inf=0x03, point=4

; 遥测 AI:
; type=normalized(归一化值16位) / float(32位IEEE754)
; 遥脉（电能脉冲）统一用 ai_ 前缀，按 AI 存储
; 工程值 = 原始值 * scale + offset
ai_001 = fun=0x02, inf=0x01, type=normalized, scale=0.1     ; A相电压
ai_002 = fun=0x02, inf=0x02, type=normalized, scale=0.1     ; B相电压
ai_003 = fun=0x02, inf=0x03, type=normalized, scale=0.1     ; C相电压
ai_004 = fun=0x02, inf=0x04, type=float, scale=1.0          ; 有功功率
ai_005 = fun=0x02, inf=0x11, type=float, scale=0.01         ; 正向有功电能（遥脉）
ai_006 = fun=0x02, inf=0x12, type=float, scale=0.01         ; 反向有功电能（遥脉）

; 遥控 DO
do_001 = fun=0x03, inf=0x01, point=1

[Device_1]
channel=1
station=1
template=保护装置
desc=1号保护设备

[Device_2]
channel=1
station=2
template=保护装置
desc=2号保护设备
