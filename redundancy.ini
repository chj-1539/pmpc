[global]
; 双机冗余配置
; 两台机器分别配置不同的 local_name 和 priority

; 本机标识
local_name=box_a

; 对方 IP 地址
peer_ip=127.0.0.1

; 心跳 TCP 端口
heartbeat_port=7503

; 数据同步 TCP 端口
sync_port=7502

; 心跳间隔（毫秒）
heartbeat_interval_ms=1000

; 连续丢失多少个心跳判定对方离线
missed_heartbeat_limit=5

; 主机恢复后是否自动切回
auto_failback=1

; 启动后延迟决策角色的时间（毫秒）
startup_delay_ms=3000

; 主机优先级（值大的优先成为主机）
priority=100
