;=============================================================================
; modbus_rtu.ini — Modbus RTU 主站采集配置
;
; 层次：global → Port → Template → Device
; 每端口独立线程，支持多设备共享同一串口
; 配置格式参考 modbus_cfg.ini（TCP主站）
;=============================================================================

[global]
timeout_ms=1000
retry_count=2
retry_sleep_ms=5000
verbose=1

[Port_1]
port_name=COM1
baud=9600
parity=even
data_bits=8
stop_bits=1
scan_ms=3000

[Template_保护装置]
; FC01 读线圈 → DI（业务遥信从 point=2 开始）
di_001 = addr=0, func=01, qty=32, point=2
; FC03 读寄存器 → AI
ai_001 = addr=0, func=03, point=1, dtype=uint16, scale=1.0, offset=0
ai_002 = addr=4, func=03, point=3, dtype=float, scale=0.01, offset=0

[Device_1]
port=1
station_id=1
template=保护装置
desc=1号保护设备

[Device_2]
port=1
station_id=2
template=保护装置
desc=2号保护设备
