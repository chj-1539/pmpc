;=============================================================================
; data_recorder.ini — 数据存储模块配置
; 将四遥数据存入 MySQL，支持多台 PMPC 实例共享同一数据库
;=============================================================================

[global]
; ─── 数据源标识（必填） ───
; 多台 PMPC 连接同一数据库时靠此字段区分数据来源
; 建议使用 IP 地址或自定义唯一名称
source=192.168.1.100

; ─── MySQL 连接 ───
host=127.0.0.1
port=3306
db=pmpc_data
user=root
password=root

; ─── 记录控制 ───
enabled=1                     ; 总开关
ai_interval_ms=5000           ; AI 默认存盘间隔（毫秒）
retention_months=12           ; 数据表保留月数（超出自动删除旧表）

; ─── DI 点位配置（选配，不在列表的不记录） ───
; 格式: tag名称 = ch=通道, dev=设备, pt=点号
[di_points]
DI_保护1_状态 = ch=1, dev=1, pt=2
DI_保护1_告警 = ch=1, dev=1, pt=3
DI_保护2_状态 = ch=1, dev=1, pt=4

; ─── AI 点位配置（选配） ───
; tag名称 = ch=通道, dev=设备, pt=点号, interval_ms=存盘间隔, unit=工程单位
; interval_ms 可选，不填则用全局 ai_interval_ms
; unit 可选，用于前端曲线 Y 轴标注
[ai_points]
AI_母线电压 = ch=1, dev=1, pt=1, interval_ms=5000, unit=kV
AI_母线电流 = ch=1, dev=1, pt=2, interval_ms=5000, unit=A
AI_有功功率 = ch=1, dev=1, pt=3, interval_ms=300000, unit=MW
AI_无功功率 = ch=1, dev=1, pt=4, interval_ms=300000, unit=MVar
AI_频率     = ch=1, dev=1, pt=5, interval_ms=5000, unit=Hz
AI_温度     = ch=1, dev=1, pt=6, interval_ms=60000, unit=°C

; ─── DO 点位配置（选配） ───
[do_points]
DO_断路器1 = ch=1, dev=1, pt=1

; ─── AO 点位配置（选配） ───
[ao_points]
AO_设定值1 = ch=1, dev=1, pt=1, interval_ms=300000
