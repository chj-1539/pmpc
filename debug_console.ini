;=============================================================================
; debug_console.ini — 调试控制台配置
; 生产环境建议关闭 enable=0 或设置密码
;=============================================================================

[global]
port=9090                  ; TCP 调试端口
verbose=1                  ; 日志级别

; 密码认证（空=不认证，设置后连接需输入密码）
password=admin123

; ─── 访问控制（可选） ───
; [listen_1]  ip=192.168.1.100  port=9090
; [listen_2]  ip=127.0.0.1      port=9091
